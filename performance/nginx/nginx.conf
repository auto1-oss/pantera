worker_processes auto;
events { worker_connections 4096; }

http {
  # Round-robin between two WireMock instances. `least_conn` would bias toward
  # whichever mock is faster at the moment — fine, but plain round-robin gives
  # a cleaner 50/50 split which is easier to interpret in stats.
  upstream wiremocks {
    server mock-upstream-a:8080;
    server mock-upstream-b:8080;
    keepalive 256;
  }

  # Large response bodies (up to 10 MB) — bump proxy buffer sizing so nginx
  # doesn't spool to disk, which would tank throughput during the 10 MB bucket.
  proxy_buffer_size      64k;
  proxy_buffers          16 64k;
  proxy_busy_buffers_size 256k;
  proxy_http_version 1.1;

  # Avoid pooling-layer hiccups: strip Connection so keepalive actually stays on
  # between nginx → WireMock.
  proxy_set_header Connection "";
  proxy_set_header Host $host;

  server {
    listen 8080;
    access_log off;            # don't spend I/O logging 1500+ rps of upstream hits

    location / {
      proxy_pass http://wiremocks;
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
      # A single backend hiccup (WireMock closing a kept-alive socket mid
      # reuse, JIT-cold first burst) must not surface as a 502 to Pantera —
      # the perf gate asserts zero circuit-breaker trips, so the mock
      # upstream has to behave like a healthy CDN. Retry idempotent
      # failures on the other backend once.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
