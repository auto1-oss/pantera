services:
  postgres:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_USER: pantera
      POSTGRES_PASSWORD: pantera
      POSTGRES_DB: pantera
    tmpfs: [/var/lib/postgresql/data]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantera"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

  valkey:
    image: valkey/valkey:7-alpine
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Two WireMock instances behind an nginx round-robin load-balancer so the
  # mock upstream can't become the benchmark's binding bottleneck at proxy-heavy
  # ramps (earlier smoke saw WireMock saturate well before the SUT). Pantera
  # sees a single host `mock-upstream:8080`; nginx distributes to two backends.
  mock-upstream-a:
    image: wiremock/wiremock:3.9.1
    # async-response-threads bounded at 48: WireMock buffers each in-flight
    # body in heap, and the 10 MB tail bucket at 200 threads needs ~2 GB —
    # the previous 1 GB container OOMed under load, then served 500s for
    # its remaining lifetime (dead qtp threads), which is what kept
    # tripping Pantera's circuit breaker and failing the perf gate.
    # --no-request-journal: the journal retains EVERY request/response in
    # heap (unbounded by default) — with 100 KB-10 MB bodies it OOMs the JVM
    # after a few thousand requests, and a wounded WireMock then drips 500s
    # that trip Pantera's circuit breaker. The journal only exists for
    # verification APIs, which this harness never uses.
    command: ["--port", "8080", "--async-response-enabled=true", "--async-response-threads=48", "--no-request-journal"]
    environment:
      JAVA_OPTS: "-Xmx1536m -Xms512m"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  mock-upstream-b:
    image: wiremock/wiremock:3.9.1
    # async-response-threads bounded at 48: WireMock buffers each in-flight
    # body in heap, and the 10 MB tail bucket at 200 threads needs ~2 GB —
    # the previous 1 GB container OOMed under load, then served 500s for
    # its remaining lifetime (dead qtp threads), which is what kept
    # tripping Pantera's circuit breaker and failing the perf gate.
    # --no-request-journal: the journal retains EVERY request/response in
    # heap (unbounded by default) — with 100 KB-10 MB bodies it OOMs the JVM
    # after a few thousand requests, and a wounded WireMock then drips 500s
    # that trip Pantera's circuit breaker. The journal only exists for
    # verification APIs, which this harness never uses.
    command: ["--port", "8080", "--async-response-enabled=true", "--async-response-threads=48", "--no-request-journal"]
    environment:
      JAVA_OPTS: "-Xmx1536m -Xms512m"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  mock-upstream:
    image: nginx:1.27-alpine
    depends_on:
      mock-upstream-a: { condition: service_started }
      mock-upstream-b: { condition: service_started }
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pantera-sut:
    image: pantera-bench:local
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      mock-upstream: { condition: service_started }
    environment:
      PANTERA_DB_URL: jdbc:postgresql://postgres:5432/pantera
      PANTERA_DB_USER: pantera
      PANTERA_DB_PASSWORD: pantera
      PANTERA_DB_POOL_MAX: "${SUT_DB_POOL_MAX:-40}"
      PANTERA_DB_POOL_MIN: "10"
      PANTERA_COOLDOWN_ENABLED: "${SUT_COOLDOWN:-true}"
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      # Credentials for the k6 load (bench/benchpass basic auth) — 2.2.0 is
      # deny-by-default for anonymous access, so unauthenticated reads 401.
      PANTERA_USER_NAME: bench
      PANTERA_USER_PASS: benchpass
      # networkaddress.cache.ttl pins successful DNS lookups for 5 min so
      # the container-DNS hiccups Docker Desktop exhibits under parallel
      # load cannot surface as upstream failures and trip the breaker —
      # the gate must only ever fail on Pantera regressions.
      JAVA_OPTS: "-Xmx${SUT_XMX:-5120m} -Xms${SUT_XMX:-5120m} -XX:+UseG1GC -XX:MaxGCPauseMillis=300 -XX:MaxDirectMemorySize=2G -Dnetworkaddress.cache.ttl=300 -Dsun.net.inetaddr.ttl=300"
    ports:
      # Host ports are overridable so the harness can run next to a dev
      # stack that already binds 8087/8088 (CI uses the defaults).
      - "${SUT_PORT_REPO:-8088}:8080"
      - "${SUT_PORT_API:-8089}:8086"
      - "${SUT_PORT_METRICS:-8087}:8087"
    deploy:
      resources:
        limits:
          cpus: "${SUT_CPUS:-4}"
          memory: "${SUT_MEM:-8G}"
    volumes:
      - ./pantera-config.yml:/etc/pantera/pantera.yml:ro
      - ./repos:/var/pantera/repo:ro
      - ./secrets:/etc/pantera/secrets:ro
      - ./data:/var/pantera/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/.health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Load generator. Not started by `up` (profile-gated); invoked explicitly:
  #   docker compose -f docker-compose-scaling.yml run --rm k6 run /scenarios/gate.js
  # The full-matrix scenario.js is driven the same way by scripts/run-cell.sh.
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    depends_on:
      pantera-sut: { condition: service_healthy }
    environment:
      BASE_URL: http://pantera-sut:8080
      GATE_RATE: "${GATE_RATE:-30}"
      GATE_DURATION: "${GATE_DURATION:-60s}"
    volumes:
      - ./k6:/scenarios:ro
