name: Perf Gate (M3-M4 invariants)

# CI-side enforcement of the M3 + M4 outbound-traffic invariants:
#   - zero upstream 429s
#   - zero sustained rate-limit gate-closed events
#   - amplification ratio ≤ 1.5
#
# These mirror the production Grafana alerts shipped in
# pantera-main/docker-compose/prometheus/rules/amplification.yml.
#
# The job boots Pantera with the existing scaling-benchmark docker-compose
# (WireMock-fronted upstream + Pantera SUT), exercises the cache-miss path
# from a k6 ramp scenario, then scrapes /metrics/vertx and asserts the
# invariants via scripts/perf-gate-check.sh.

on:
  pull_request:
    branches: [master, 2.2.0]
    paths:
      - 'pantera-core/**'
      - 'pantera-main/**'
      - 'maven-adapter/**'
      - 'http-client/**'
      - 'performance/**'
      - 'scripts/perf-gate-check.sh'
      - '.github/workflows/perf-gate.yml'

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    # 30 min upper bound: 10 min build + 10 min stack-up + 5 min ramp + 5 min slack.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Pantera image
        working-directory: performance
        run: |
          # Reuses the existing scaling-benchmark Make target which packages
          # pantera-main and builds the local image — same artifact path
          # production smoke tests use.
          make build

      - name: Prepare harness (bodies, config, keys, seeded files)
        working-directory: performance
        run: make setup

      - name: Start Pantera + mock-upstream stack
        working-directory: performance
        run: |
          # `pantera-sut` pulls in postgres, valkey and the WireMock pair
          # behind nginx via depends_on. Wait on the compose healthcheck,
          # then confirm the metrics endpoint answers (the gate's data
          # source) or dump logs and fail loudly.
          docker compose -f docker-compose-scaling.yml up -d pantera-sut
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8087/metrics/vertx > /dev/null 2>&1; then
              echo "Pantera metrics endpoint is up"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8087/metrics/vertx > /dev/null \
            || (docker compose -f docker-compose-scaling.yml logs --tail=200 pantera-sut; exit 1)

      - name: Ramp traffic through cold-cache path
        working-directory: performance
        env:
          GATE_DURATION: 60s
          GATE_RATE: 30
        run: |
          # gate.js is the bounded gate load (constant arrival rate, reads
          # only, biased to the proxy cold-cache path) — NOT the ~20 min
          # scaling ramp in scenario.js, which runs nightly. No `|| true`:
          # a silent all-401/all-503 run must fail here instead of handing
          # the invariant check an idle instance.
          docker compose -f docker-compose-scaling.yml run --rm \
            -e GATE_DURATION -e GATE_RATE \
            k6 run /scenarios/gate.js

      - name: Run perf-gate check
        run: |
          chmod +x scripts/perf-gate-check.sh
          scripts/perf-gate-check.sh http://localhost:8087/metrics/vertx

      - name: Collect logs on failure
        if: failure()
        working-directory: performance
        run: |
          docker compose -f docker-compose-scaling.yml logs --tail=300 pantera-sut > /tmp/pantera.log || true
          docker compose -f docker-compose-scaling.yml logs --tail=300 mock-upstream mock-upstream-a mock-upstream-b > /tmp/wiremock.log || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-gate-diagnostics
          path: |
            /tmp/pantera.log
            /tmp/wiremock.log
          retention-days: 14

      - name: Tear down
        if: always()
        working-directory: performance
        run: docker compose -f docker-compose-scaling.yml down -v
