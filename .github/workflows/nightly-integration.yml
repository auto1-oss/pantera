name: Nightly integration tests (itcase)

# Integration tests (TestContainers, -Pitcase) are too heavy for the PR
# loop and were previously executed ONLY by the tag-driven release
# workflow — meaning a broken integration surface was discovered at the
# worst possible moment. This nightly run keeps them exercising master
# continuously, without blocking anyone. Failures show up on the Actions
# dashboard (and can be wired to notifications later).

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'   # 02:43 UTC nightly (before the cold-bench at 03:17)

permissions:
  contents: read

concurrency:
  group: nightly-itcase
  cancel-in-progress: true

jobs:
  itcase:
    name: mvn verify -Pitcase
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pantera
          POSTGRES_PASSWORD: pantera
          POSTGRES_DB: pantera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build test Docker images
        run: cd test_images && ./build.sh

      - name: Integration tests
        run: mvn clean verify -Pitcase -T 1C --fail-at-end
        env:
          POSTGRES_USER: pantera
          POSTGRES_PASSWORD: pantera

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: itcase-failure-reports
          path: '**/target/failsafe-reports/'
          retention-days: 14
