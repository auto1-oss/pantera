name: CI

# PR-gated only: branch protection requires these checks green before a
# merge, so re-running the identical build on the push to master would be
# pure waste. Direct pushes to master are blocked by the same protection;
# workflow_dispatch covers the rare manual verification need.
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled — force-pushes to a PR
# don't stack 30-minute builds behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Cheap static gates first (~seconds). The expensive build/test jobs
  # depend on this, so a PR that trips a grep-level guard fails in
  # under a minute instead of after a full backend build. This job
  # also computes which areas changed so backend/UI jobs can skip
  # when a PR doesn't touch them.
  # ------------------------------------------------------------------
  static-checks:
    name: Static gates + change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: ECS log schema drift gate
        run: |
          if grep -rl "JsonLayout" pantera-main/src/main/resources/ pantera-main/docker-compose/ 2>/dev/null; then
            echo "ERROR: JsonLayout found in active log4j2 configuration. Use EcsLayout instead."
            exit 1
          fi
          echo "Schema drift gate: OK (no JsonLayout in active configurations)"

      - name: nginx CVE-2026-42945 trigger-pattern guard
        run: bash scripts/check-nginx-cve-2026-42945.sh

      # Plain git-diff change detection — deliberately no third-party
      # action here: the org Actions policy allows GitHub-owned only, and
      # for a supply-chain product the smaller trust surface is a feature.
      - name: Detect changed areas
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=__all__
          fi
          BACKEND=false; UI=false
          if [ "$CHANGED" = "__all__" ]; then
            BACKEND=true; UI=true
          else
            echo "$CHANGED" | grep -qE '^(pom\.xml|.*/pom\.xml|[^/]+-adapter/|pantera-core/|pantera-main/|pantera-storage|pantera-backfill/|vertx-server/|http-client/|asto/|build-tools/|\.github/workflows/ci\.yml)' && BACKEND=true
            echo "$CHANGED" | grep -qE '^(pantera-ui/|\.github/workflows/ci\.yml)' && UI=true
          fi
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "ui=$UI" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND ui=$UI"

  build-backend:
    name: Build & Test Backend
    needs: static-checks
    # Always run on pushes to master; on PRs only when backend paths changed.
    if: github.event_name != 'pull_request' || needs.static-checks.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pantera
          POSTGRES_PASSWORD: pantera
          POSTGRES_DB: pantera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # One reactor session runs unit tests + PMD + license check (both are
      # bound to `verify` in the root pom). Do NOT split these into separate
      # `mvn test` / `mvn pmd:check` steps: standalone pmd:check resolves the
      # build-tools ruleset jar AND sibling-module jars (aux classpath) from
      # the local repository, which is empty on a clean runner — only an
      # in-session reactor build resolves them without prior `install`.
      #
      # -Dexec.skip: the docker-build profile auto-activates whenever
      # /var/run/docker.sock exists (true on runners) and binds a multi-arch
      # `docker buildx --load` to pantera-main's install phase — impossible
      # without arm64 binfmt and not CI's job; release.yml publishes images.
      - name: Build, test, verify (unit tests + PMD + license)
        run: mvn clean install -T8 --fail-at-end -ntp -Dexec.skip=true
        env:
          POSTGRES_USER: pantera
          POSTGRES_PASSWORD: pantera

      - name: Package JAR with dependencies
        run: |
          mvn package dependency:copy-dependencies -DskipTests -q -pl pantera-main
          echo "JAR_FILE=$(ls pantera-main/target/pantera-main-*.jar | head -1)" >> $GITHUB_ENV

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pantera-backend
          path: |
            pantera-main/target/pantera-main-*.jar
            pantera-main/target/dependency/
          retention-days: 5

  build-ui:
    name: Build & Test UI
    needs: static-checks
    if: github.event_name != 'pull_request' || needs.static-checks.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: pantera-ui

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pantera-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pantera-ui
          path: pantera-ui/dist/
          retention-days: 5
