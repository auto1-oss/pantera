meta:
  storage:
    type: fs
    path: /var/pantera/repo
  
  # JWT token settings (RS256 — RSA key pair)
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-expiry-seconds: 3600
    refresh-token-expiry-seconds: 604800
  
  credentials:
    # - type: env
    # - type: pantera
    - type: keycloak
      url: "http://keycloak:8080"
      realm: pantera
      client-id: pantera
      client-password: ${KEYCLOAK_CLIENT_SECRET}
      user-domains:
        - "local"

    - type: jwt-password

    - type: okta
      issuer: ${OKTA_ISSUER}
      client-id: ${OKTA_CLIENT_ID}
      client-secret: ${OKTA_CLIENT_SECRET}
      redirect-uri: ${OKTA_REDIRECT_URI}
      scope: "openid email profile groups"
      groups-claim: "groups"
      # ACCESS GATE: if set, the user's id_token MUST carry at least one
      # of these groups or SSO login is rejected (403). This is the
      # primary "who can access Pantera" control. Without it, ANY
      # authenticated Okta user gets auto-provisioned as a reader —
      # insecure for production. Groups are matched case-sensitively.
      allowed-groups:
        - pantera_readers
        - pantera_admins
      group-roles:
         - pantera_readers: "reader"
         - pantera_admins: "admin"
      user-domains:
        - "@auto1.local"
  
  policy:
    type: pantera
    eviction_millis: 180000 # optional, default 3 min
    storage:
      type: fs
      path: /var/pantera/security
  
  cooldown:
    # Global default: disabled. Only enable for specific repo types below.
    enabled: false
    # Use duration strings: m = minutes, h = hours, d = days
    minimum_allowed_age: 7d
    repo_types:
      npm-proxy:
        enabled: true
      maven-proxy:
        enabled: true
      gradle-proxy:
        enabled: true
  
  artifacts_database:
    postgres_host: "pantera-db"
    postgres_port: 5432
    postgres_database: pantera
    postgres_user: ${POSTGRES_USER}
    postgres_password: ${POSTGRES_PASSWORD}
    pool_max_size: 50
    pool_min_idle: 10
  
  http_client:
    proxy_timeout: 120
    max_connections_per_destination: 512
    max_requests_queued_per_destination: 4096
    idle_timeout: 60000
    connection_timeout: 15000
    follow_redirects: true
    connection_acquire_timeout: 120000  # ms to wait for pooled connection before failing

  http_server:
    # ISO-8601 duration (or milliseconds) before failing long running requests. Use 0 to disable.
    request_timeout: PT2M

  metrics:
    endpoint: /metrics/vertx # Path of the endpoint, starting with `/`, where the metrics will be served
    port: 8087 # Port to serve the metrics
    types:
      - jvm # enables jvm-related metrics
      - storage # enables storage-related metrics
      - http # enables http requests/responses related metrics
  global_prefixes:
    - test_prefix

  # Cache configuration — aligned with pantera-performance-tuned.yaml so
  # the docker-compose dev stack behaves like production. See that file
  # for the per-cache rationale; sizes are the same.
  caches:
    valkey:
      enabled: true
      host: valkey
      port: 6379
      timeout: 150ms

    auth-enabled:
      l1:
        maxSize: 30000
        ttlSeconds: 300
      l2:
        enabled: true
        ttlSeconds: 3600
        timeoutMs: 100

    group-metadata-stale:
      l1:
        maxSize: 100000
        ttlSeconds: 2592000
      l2:
        enabled: true
        ttlSeconds: 604800
        timeoutMs: 100

    repo-negative:
      ttl: 1h
      maxSize: 200000
      valkey:
        enabled: true
        l1MaxSize: 200000
        l1Ttl: 1h
        l2MaxSize: 3000000
        l2Ttl: 24h
        timeout: 100ms

    cooldown-metadata:
      ttl: 1h
      maxSize: 100000
      valkey:
        enabled: true
        l1MaxSize: 100000
        l1Ttl: 1h
        l2MaxSize: 500000
        l2Ttl: 12h
        timeout: 200ms

    artifact-index-positive:
      ttl: 1h
      maxSize: 500000
      valkey:
        enabled: true
        l1MaxSize: 500000
        l1Ttl: 1h
        l2MaxSize: 5000000
        l2Ttl: 2h
        timeout: 100ms

    artifact-index-negative:
      ttl: 10m
      maxSize: 300000
      valkey:
        enabled: true
        l1MaxSize: 300000
        l1Ttl: 10m
        l2MaxSize: 1000000
        l2Ttl: 1h
        timeout: 100ms

    auth:
      ttl: 10m
      maxSize: 20000
      valkey:
        enabled: true
        l1MaxSize: 20000
        l1Ttl: 10m
        l2MaxSize: 200000
        l2Ttl: 2h

    policy-perms:
      ttl: 5m
      maxSize: 5000
    policy-users:
      ttl: 5m
      maxSize: 30000
    policy-roles:
      ttl: 5m
      maxSize: 2000

    filters:
      ttl: 5m
      maxSize: 2000