# Upstream pool with keep-alive connections to Pantera.
#
# Without an explicit `upstream` block plus the `keepalive` directive,
# `proxy_http_version 1.1` + `proxy_set_header Connection ""` are NOT
# enough — nginx still opens a fresh TCP connection to Pantera per
# incoming request and leaves it in TIME_WAIT after closing. On the
# cold-bench (~1000 small requests through `mvn dependency:resolve`)
# this adds ~340 ms per request and dominates wall time.
#
# With keepalive 64 the connection-setup cost amortises to ~0; effective
# pool of 64 idle upstream connections is well above mvn's typical
# 5 per-host concurrency. Tune higher if a single Pantera fronts many
# concurrent mvn clients.
upstream pantera_backend {
    server pantera:8080;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

upstream pantera_ui_backend {
    server pantera-ui:80;
    keepalive 16;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;

    # Pantera UI — management console
    location /ui/ {
        proxy_pass http://pantera_ui_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $host strips the port (e.g. a request for "localhost:8081" arrives
        # at Pantera as just "localhost"); $http_host preserves it verbatim.
        # Without this, a repository with no explicit `url:` derives a
        # portless client-facing base URL from Host alone — see the sibling
        # `location /` block below for the concrete symptom this fixed.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location / {
        client_max_body_size 500M;
        proxy_pass http://pantera_backend;
        # $host strips the port -- e.g. corepack configured with
        # COREPACK_NPM_REGISTRY=http://localhost:8081/npm_group requested
        # http://localhost/npm_group/pnpm/-/pnpm-11.17.0.tgz (missing :8081)
        # because Pantera saw Host: localhost and, with no `url:` configured
        # on npm_group, derived a portless base. $http_host preserves the
        # port Pantera actually needs to round-trip through this proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Docker registry proxy timeouts (upstream may be slow)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;

        # Handle large Docker layer uploads + keep-alive upstream pool
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    client_max_body_size 500M;

    # Pantera UI — management console
    location /ui/ {
        proxy_pass http://pantera_ui_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # See the plain-HTTP server block above for why $http_host (not
        # $host, which strips the port) is required here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location / {
        client_max_body_size 500M;
        proxy_pass http://pantera_backend;
        # See the plain-HTTP server block above for why $http_host (not
        # $host, which strips the port) is required here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Docker registry proxy timeouts (upstream may be slow)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;

        # Handle large Docker layer uploads + keep-alive upstream pool
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
